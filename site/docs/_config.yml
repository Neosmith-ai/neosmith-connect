title: NeoSmith Developer Guide
description: Connect your IDE and AI coding agent to NeoSmith in under 5 minutes.
remote_theme: just-the-docs/just-the-docs

# Pages build: driven by .github/workflows/pages.yml on push to main.
# The repo's Pages "Build source" is already set to GitHub Actions
# (build_type: "workflow"), so that workflow is what serves this site.

color_scheme: light
search_enabled: true

# Pretty URLs (no .html) so in-content cross-links like
# ../agents/claude-code resolve correctly.
permalink: pretty

# Header / external links
aux_links_new_tab: true

nav_external_links:
  - title: contact-us@neosmith.ai
    url: mailto:contact-us@neosmith.ai

# Exclude source-of-truth duplicates / internal files from the build.
# vendor/ must be excluded or Jekyll tries to parse gem internals as posts.
exclude:
  - CONTRIBUTING.md
  - "*.local.md"
  - vendor/
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
