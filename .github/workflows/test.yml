# Contract test suite + cross-OS CI matrix (T8 + T16).
#
# Runs `node --test` against packages/cli/scripts/contract/*.test.js on the
# three GitHub-hosted runners. Node 18 (the engines minimum) and Node 20 (LTS)
# are both exercised per matrix cell — that's 3 OS × 2 Node = 6 jobs.
#
# Known gap (T16): WSL2 is not covered by GitHub-hosted runners; it requires a
# self-hosted runner with nested virtualization. Tracked as a follow-up.

name: test

on:
  push:
    branches: [main, feature/neosmith-dev-setup]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install cli deps (smol-toml, yaml — needed by codex/continue on)
        working-directory: packages/cli
        run: npm install --omit=dev --no-fund --no-audit

      - name: Syntax-check every lib module
        working-directory: packages/cli
        run: |
          for f in bin/neosmith.js lib/*.js lib/harnesses/*.js lib/commands/*.js scripts/*.js scripts/contract/*.js; do
            node --check "$f"
          done
        shell: bash

      - name: Contract test suite
        working-directory: packages/cli
        # scripts/run-contract.js runs every scripts/contract/*.test.js via the
        # node:test run() API and exits non-zero on failure — portable across
        # Node 18/20/22/24 and all OSes. New test files run automatically.
        run: node scripts/run-contract.js

      - name: Smoke gate (contract suite + isolated claude on/off rehearsal)
        working-directory: packages/cli
        run: npm run smoke:ci

      - name: Verify manifest-driven docs match the manifest
        run: node scripts/generate-docs.js --check

      # Drives the e2e driver over all 8 harnesses against the offline contract
      # mock: no secrets, no network, no cost. Proves run.js works on every OS
      # before the paid staging workflow depends on it — a bug in the driver
      # should cost a free job, not a billed one.
      - name: Offline e2e (all harnesses, contract mock)
        working-directory: packages/cli
        run: npm run e2e:offline

  # scripts/contract/packing.test.js already asserts the tarball CONTENTS in
  # every matrix cell (via `npm pack --dry-run`). This job covers the part a
  # dry run cannot: actually installing the tarball and running the binary
  # that npm resolves, from a directory with no checkout in sight — so a
  # relative require that only works inside the repo fails here rather than
  # for the first user who installs from npm.
  tarball:
    name: install the tarball and run the installed binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Pack
        working-directory: packages/cli
        run: |
          npm install --omit=dev --no-fund --no-audit
          npm pack --pack-destination /tmp
      - name: Install globally and drive it
        run: |
          set -e
          TARBALL=$(ls /tmp/neosmithai-cli-*.tgz)
          npm install -g "$TARBALL"
          cd /tmp
          BIN=$(command -v neosmith)
          echo "resolved: $BIN"
          case "$BIN" in
            *"$GITHUB_WORKSPACE"*)
              echo "::error::neosmith resolved to the checkout, not the installed package"
              exit 1 ;;
          esac
          neosmith --version
          neosmith help
          neosmith status
          neosmith --env staging help | grep -q "staging.router.neosmith.ai"
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: /tmp/neosmithai-cli-*.tgz
          retention-days: 3
