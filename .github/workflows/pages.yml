# Pages deploy — replaces the repo Settings → Pages → /docs on main
# configuration with an actions/deploy-pages workflow. Source path is
# site/docs/, which feeds Jekyll → _site → GitHub Pages artifact.
#
# The repo's Pages "Build source" is set to GitHub Actions — confirmed via
# `gh api repos/Neosmith-ai/neosmith-connect/pages` (build_type: "workflow"),
# so this workflow is what serves the site. The note that used to sit here said
# the setting still needed flipping; it had been done, and a stale prerequisite
# is worse than none — it invites someone to "fix" a setting that is correct.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only at the workflow level. `pages: write` and `id-token: write` are
# granted only to the `deploy` job that actually needs them — the `build` job
# runs `bundle exec jekyll build` over repository content and has no business
# holding a token that can publish a site.
permissions:
  contents: read

# Two concurrent runs against main can race the Pages deploy; let the
# second one queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The manifest-driven blocks must match the manifest. Drift means
      # harnesses.json changed and generate-docs.js was not re-run; fail
      # before building rather than publishing a stale table.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20" }
      - name: Verify manifest-driven docs match the manifest
        # generate-docs.js owns five blocks under site/docs/ — the landing-page
        # harness table, the compatibility matrix, the Agents index, and the
        # endpoints + SKU tables. Drift means harnesses.json changed and the
        # generator was not re-run.
        run: node scripts/generate-docs.js --check

      # Pinned by commit SHA, not by tag. `@v1` is a moving pointer the upstream
      # maintainer can repoint at any time; the only third-party action in this
      # repo is the one worth pinning hardest. Dependabot bumps it (see
      # .github/dependabot.yml) and the bump goes through review like any other
      # change.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # Ruby 3.1 — the github-pages gem pins Jekyll 3.x which is
          # incompatible with Ruby 3.2+. GitHub Pages itself runs 3.1.
          ruby-version: "3.1"
          bundler-cache: true
          working-directory: site/docs

      - name: Build Jekyll site
        working-directory: site/docs
        run: bundle exec jekyll build --destination ../../_site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Exposed so verify-published can ask the URL this run actually deployed to,
    # rather than a hardcoded guess that goes stale if the repo is ever renamed.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Everything above inspects the REPOSITORY. None of it proves a page came out
  # the other end — which is why two harness pages could 404 on the live guide
  # for months while every in-repo check stayed green. This asks the site.
  verify-published:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "20" }
      - name: Every manifest harness has a live page
        # Pages serves from a CDN, so a fresh deploy can take a moment to
        # propagate. Retry before calling it a failure.
        run: |
          for attempt in 1 2 3; do
            if node scripts/check-published-docs.js --base "${{ needs.deploy.outputs.page_url || 'https://neosmith-ai.github.io/neosmith-connect' }}"; then
              exit 0
            fi
            echo "attempt $attempt failed; waiting for the CDN…"
            sleep 20
          done
          echo '::error::Published docs are missing pages the manifest declares'
          exit 1
