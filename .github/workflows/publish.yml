name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sanity check — tag matches package.json version
        run: |
          PKG_VER=$(node -p "require('./packages/cli/package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) != tag ($TAG_VER)"
            exit 1
          fi
      - name: Install deps
        working-directory: packages/cli
        run: npm install --omit=dev --no-fund --no-audit
      - name: Contract tests
        working-directory: packages/cli
        # run-contract.js discovers every scripts/contract/*.test.js. The old
        # hand-maintained file list silently drifted — env-preservation,
        # originals and envsetup were all missing from it, so the publish gate
        # was weaker than the PR gate that let those changes in.
        run: node scripts/run-contract.js
      # The previous check ran `node bin/neosmith.js help` from the SOURCE
      # TREE, where every file is present whether or not it is packed — so it
      # could not catch a file missing from the `files` allowlist, which
      # CONTRIBUTING.md calls the most common "worked locally, broken on npm"
      # bug. Build the tarball, install it globally, and drive THAT binary.
      - name: Smoke test — install the tarball and run the installed binary
        working-directory: packages/cli
        run: |
          set -e
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/neosmithai-cli-*.tgz)
          echo "packed: $TARBALL"
          npm install -g "$TARBALL"

          # Run from a directory with no checkout in sight, so a stray relative
          # require cannot accidentally resolve against the source tree.
          cd /tmp
          command -v neosmith
          neosmith --version
          neosmith help
          neosmith models --help 2>/dev/null || true
          # The manifest and the contract must both be readable from the
          # installed location — each is loaded from disk, not bundled.
          neosmith status

      - name: Publish
        working-directory: packages/cli
        # Route prereleases to a dist-tag instead of `latest`. Without this a
        # `v0.9.0-rc.1` tag publishes straight to `latest` and every `npm
        # install @neosmithai/cli` picks up a release candidate.
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          case "$TAG_VER" in
            *-rc*|*-beta*|*-alpha*|*-next*)
              DIST_TAG=next ;;
            *)
              DIST_TAG=latest ;;
          esac
          echo "publishing $TAG_VER to dist-tag '$DIST_TAG'"
          # Provenance (--provenance) requires GitHub's OIDC token provider,
          # which has been intermittently unavailable during the Aug 6 2026
          # Actions outage. Re-enable once GitHub stabilizes.
          npm publish --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
