name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sanity check — tag matches package.json version
        run: |
          PKG_VER=$(node -p "require('./packages/cli/package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) != tag ($TAG_VER)"
            exit 1
          fi
      - name: Install deps
        working-directory: packages/cli
        run: npm install --omit=dev --no-fund --no-audit
      - name: Contract tests
        working-directory: packages/cli
        run: node --test scripts/contract/io.audit.test.js scripts/contract/harness.registry.test.js scripts/contract/claude.test.js scripts/contract/codex.test.js scripts/contract/continue.test.js scripts/contract/ui.harnesses.test.js
      - name: Smoke test — CLI loads + help renders
        working-directory: packages/cli
        run: node bin/neosmith.js help
      - name: Publish
        working-directory: packages/cli
        # Provenance (--provenance) requires GitHub's OIDC token provider,
        # which has been intermittently unavailable during the Aug 6 2026
        # Actions outage. Re-enable once GitHub stabilizes:
        #   npm publish --access public --provenance
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
