# Publish @neosmithai/cli to npm.
#
# This workflow can put code on every user's machine, which makes the tag that
# triggers it the highest-value write in the repository. Three controls sit
# between a tag and a published package:
#
#   1. A TAG RULESET restricts who may create a `v*` tag at all.
#   2. The `npm-publish` ENVIRONMENT requires a maintainer to approve the
#      deployment, and NPM_TOKEN is an environment secret scoped to it — not a
#      repository secret readable by any job in any workflow.
#   3. The ancestry check below refuses to publish a commit that is not on
#      `main`, so a tag pointing at an unreviewed commit fails before npm is
#      contacted.
#
# Any one of these can be bypassed by a determined maintainer. All three
# together mean it cannot happen by accident, which is the realistic threat.

name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires a maintainer to approve the deployment. NPM_TOKEN lives on this
    # environment, so no other job — present or future — can read it.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@neosmithai/cli
    permissions:
      contents: read
      # OIDC token for `npm publish --provenance`.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No GITHUB_TOKEN left in .git/config after checkout. The `git fetch`
          # in the ancestry check below still works because this repository is
          # public and an anonymous HTTPS fetch is enough. If it is ever made
          # private, that step needs credentials back.
          persist-credentials: false
          # The ancestry check needs real history, and a tag push checks out at
          # depth 1 by default.
          fetch-depth: 0

      # No `cache:` input is set, so setup-node restores nothing — there is no
      # cache for a less-trusted ref to poison. zizmor flags the action by its
      # presence in a publishing workflow, at Low confidence; the suppression is
      # in .github/zizmor.yml with this reasoning. Adding a cache here would
      # make the finding real, so: do not.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # A tag is just a pointer. Nothing stopped someone tagging a commit that
      # had never been reviewed, or one from an abandoned branch, and this
      # workflow would have published it. `main` is protected and requires
      # review, so "reachable from main" is the cheapest available proof that a
      # human approved this code.
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main — refusing to publish."
            {
              echo "Tag \`$GITHUB_REF_NAME\` points at a commit that is not on main."
              echo "Publishing it would ship code that never passed review."
              echo "Delete the tag, merge the change to main, and tag the merge commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Sanity check — tag matches package.json version
        run: |
          PKG_VER=$(node -p "require('./packages/cli/package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($PKG_VER) != tag ($TAG_VER)"
            exit 1
          fi
      - name: Install deps
        working-directory: packages/cli
        run: npm install --omit=dev --no-fund --no-audit
      - name: Contract tests
        working-directory: packages/cli
        # run-contract.js discovers every scripts/contract/*.test.js. The old
        # hand-maintained file list silently drifted — env-preservation,
        # originals and envsetup were all missing from it, so the publish gate
        # was weaker than the PR gate that let those changes in.
        run: node scripts/run-contract.js
      # The previous check ran `node bin/neosmith.js help` from the SOURCE
      # TREE, where every file is present whether or not it is packed — so it
      # could not catch a file missing from the `files` allowlist, which
      # CONTRIBUTING.md calls the most common "worked locally, broken on npm"
      # bug. Build the tarball, install it globally, and drive THAT binary.
      - name: Smoke test — install the tarball and run the installed binary
        working-directory: packages/cli
        run: |
          set -e
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/neosmithai-cli-*.tgz)
          echo "packed: $TARBALL"
          npm install -g "$TARBALL"

          # Run from a directory with no checkout in sight, so a stray relative
          # require cannot accidentally resolve against the source tree.
          cd /tmp
          command -v neosmith
          neosmith --version
          neosmith help
          neosmith models --help 2>/dev/null || true
          # The manifest and the contract must both be readable from the
          # installed location — each is loaded from disk, not bundled.
          neosmith status

      - name: Publish
        working-directory: packages/cli
        # Route prereleases to a dist-tag instead of `latest`. Without this a
        # `v0.9.0-rc.1` tag publishes straight to `latest` and every `npm
        # install @neosmithai/cli` picks up a release candidate.
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          case "$TAG_VER" in
            *-rc*|*-beta*|*-alpha*|*-next*)
              DIST_TAG=next ;;
            *)
              DIST_TAG=latest ;;
          esac
          echo "publishing $TAG_VER to dist-tag '$DIST_TAG'"
          # --provenance signs an attestation linking this exact tarball to this
          # exact workflow run and commit, verifiable by anyone with
          # `npm audit signatures`. It is the single strongest signal a consumer
          # has that the package on npm came from this repository.
          #
          # It was disabled during the Aug 6 2026 Actions outage, when the OIDC
          # token provider was intermittently unavailable. That is long resolved
          # and `id-token: write` is declared above.
          npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
