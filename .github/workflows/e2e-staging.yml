name: e2e · real harnesses against staging

# The high-fidelity gate. Installs the REAL Claude Code and Codex binaries on
# macOS and Windows runners, installs @neosmithai/cli from a TARBALL (not the
# checkout), wires each harness to the staging router, and sends a real prompt
# through it.
#
# CONTRIBUTING.md:88 names this as the only untested step and the place
# integration bugs surface. scripts/e2e/offline.js already runs the same driver
# against a contract mock in test.yml on every push — this workflow adds the
# two things a mock cannot provide: real harness binaries and real inference.
#
# COST: two inference calls per matrix cell (claude + codex), four per run,
# every one pinned to the cheapest sealed SKU in the contract
# (skus.cheapestForSmoke — never escalates to a frontier model). The CI key
# additionally carries a server-side dev_hard_ceiling_tokens, so no bug here
# can produce a large bill.
#
# ACYCLICITY INVARIANT (router_v4/contract/README.md): this workflow must never
# gate router-v4's deploy, and router-v4's CLI gate must never depend on
# staging being up. Those two rules keep the cross-repo CI graph a DAG.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to test against
        default: staging
        type: choice
        options: [staging, prod]
      harnesses:
        description: Comma-separated harness ids, or "all"
        default: all
        type: string
      claude_version:
        description: npm version of @anthropic-ai/claude-code (pin when upstream breaks)
        default: latest
        type: string
      codex_version:
        description: npm version of @openai/codex
        default: latest
        type: string
  # Push-to-main trigger: one post-merge run, on the cheapest sealed SKU,
  # with the spend cap on the CI key as belt-and-braces. The preflight
  # job still gates the work: if staging is down on a push, the matrix
  # is skipped.
  push:
    branches: [main]
  # Every-PR trigger: opens / synchronize / reopened. No label gate —
  # the gate now lives in the preflight job, where the same-repo guard
  # silently skips fork PRs (which never see secrets anyway, so they
  # always fail at the `have_key` check; see the preflight `if:`).
  # Stays dispatch-triggerable for manual rerun.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Never pull_request_target — that is the canonical way a staging key leaks
# from a fork. `pull_request` runs the fork's code with the fork's (empty)
# secrets; `pull_request_target` runs it with OURS.
#
# The second control is the `staging-e2e` environment on the `e2e` job below.
# The trigger keeps forks out; the environment keeps a same-repo branch out
# until a maintainer has read the diff and approved the deployment. Both are
# needed: the trigger alone stops working the moment anyone is granted write
# access, and this workflow executes code from the PR head commit.
permissions:
  contents: read

concurrency:
  group: e2e-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_ENV: ${{ inputs.env || 'staging' }}

jobs:
  # ── preflight ──────────────────────────────────────────────────────────────
  # A staging blip must not turn every PR red — a workflow that cries wolf gets
  # ignored inside a week. So: scheduled runs FAIL on an unhealthy staging
  # (that is a real alert), while PR runs skip the matrix with a neutral note.
  #
  # THIS JOB DELIBERATELY HOLDS NO SECRET. It used to authenticate against
  # /whoami, which meant the staging key was handed to two jobs per run instead
  # of one — and, once the `e2e` job moved behind an environment reviewer, it
  # would have meant two approval prompts for one run. /ready is unauthenticated
  # and answers the only question preflight actually asks: is staging up? The
  # authenticated checks moved into `e2e`, which holds the key anyway.
  preflight:
    name: staging reachable?
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}
    # Two exclusions, both of which skip this job — and because every downstream
    # job is gated on `healthy`, skipping here skips the whole chain.
    #
    #   1. FORK PRs. A fork never receives secrets, so it could only ever reach
    #      the key check and fail. It also must never reach the environment.
    #
    #   2. DEPENDABOT PRs. This one is not obvious and cost us four red runs on
    #      2026-08-28, the day Dependabot was switched on. A Dependabot branch
    #      lives in THIS repository, so the same-repo test above passes — but
    #      GitHub deliberately withholds Actions secrets from Dependabot-
    #      triggered runs (they read from a separate "Dependabot secrets" store,
    #      which is empty here). So `secrets.NEOSMITH_STAGING_KEY` arrives empty,
    #      the run burns a maintainer's approval on the environment gate, and
    #      then fails on something no reviewer of a dependency bump can fix.
    #
    #      A dependency bump also has nothing to say about real-harness
    #      behaviour: test.yml already runs the full contract matrix and the
    #      offline e2e on these PRs, which is the signal that actually matters
    #      for "did bumping smol-toml break anything".
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set +e
          BASE=$(node -p "require('./packages/cli/harnesses.json').environments['${E2E_ENV}'].baseUrl")
          echo "base=$BASE"

          READY=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/ready")
          echo "ready=$READY"

          if [ "$READY" = "200" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "$BASE is unhealthy (ready=$READY)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Staging is down — skipping (PR run)
        if: steps.check.outputs.healthy != 'true' && github.event_name == 'pull_request'
        run: echo "::notice::${E2E_ENV} is unreachable; skipping the e2e matrix rather than failing this PR."

      - name: Staging is down — failing (scheduled run)
        if: steps.check.outputs.healthy != 'true' && github.event_name == 'schedule'
        run: |
          echo "::error::${E2E_ENV} is unreachable on a scheduled run. This is a real alert."
          exit 1

  # ── pack ───────────────────────────────────────────────────────────────────
  # Build the tarball ONCE and assert its contents before spending a cent on
  # inference. The matrix installs this artifact, so the published package —
  # not the checkout — is what the real harnesses drive.
  pack:
    name: pack + verify the tarball
    needs: preflight
    if: needs.preflight.outputs.healthy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "20"}
      - name: Install deps
        working-directory: packages/cli
        run: npm install --omit=dev --no-fund --no-audit
      - name: Assert the tarball contents
        working-directory: packages/cli
        # packing.test.js reads `npm pack --dry-run --json` and fails if any
        # lib module, harnesses.json or the contract is missing from the
        # allowlist — the "worked locally, broken on npm" class.
        run: node scripts/run-contract.js --only packing
      - name: Pack
        working-directory: packages/cli
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/neosmithai-cli-*.tgz
          retention-days: 3

  # ── the real thing ─────────────────────────────────────────────────────────
  # This is the ONLY job in the repository that touches NEOSMITH_STAGING_KEY,
  # and it runs code checked out from the pull request's head commit. Those two
  # facts together are the whole reason for the environment gate below.
  #
  # NEOSMITH_STAGING_KEY is an ENVIRONMENT secret on `staging-e2e`, not a
  # repository secret. That distinction is load-bearing: a repository secret is
  # readable by any job in any workflow, so the reviewer prompt would be
  # decorative — a contributor could simply add a second job that reads it. As
  # an environment secret it is unreachable except from a job that declares
  # `environment: staging-e2e`, and such a job does not start until a maintainer
  # has approved the deployment, having read the diff.
  #
  # The same-repo guard on `preflight` is the outer layer; this is the inner
  # one. A fork PR never gets here at all.
  e2e:
    name: ${{ matrix.os }} · real harnesses
    needs: [preflight, pack]
    if: needs.preflight.outputs.healthy == 'true'
    runs-on: ${{ matrix.os }}
    environment: staging-e2e
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 20 only — test.yml already covers 18/20 across three OSes for
        # everything that does not need a real harness binary.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "20"}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/tarball

      # These two checks lived in `preflight` until the environment gate landed.
      # They need the key, and this is now the only job that has it.
      #
      # A key that has been rotated or revoked produces a run that fails deep
      # inside a harness with an unhelpful message; asking /whoami first turns
      # that into one clear line.
      - name: The staging key still works
        shell: bash
        env:
          KEY: ${{ secrets.NEOSMITH_STAGING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::NEOSMITH_STAGING_KEY is not set on the staging-e2e environment."
            {
              echo "Mint an sk-slm-* key (cheapest tier, and covered by the CLI's audit redaction),"
              echo "give it a small dev_hard_ceiling_tokens, and add it as an ENVIRONMENT secret"
              echo "on \`staging-e2e\` — not as a repository secret."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          BASE=$(node -p "require('./packages/cli/harnesses.json').environments['${E2E_ENV}'].baseUrl")
          WHO=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20                  -H "Authorization: Bearer $KEY" "$BASE/whoami")
          echo "whoami=$WHO"
          if [ "$WHO" != "200" ]; then
            echo "::error::$BASE/whoami returned $WHO — the staging key is rejected or expired."
            exit 1
          fi

      # Confirm the router agrees about which environment answered. A stale DNS
      # entry or a proxy returns a healthy 200 from the WRONG deployment, and
      # no amount of client-side hostname matching can detect that — which is
      # why /whoami carries `environment`.
      - name: The responding router is the environment we asked for
        shell: bash
        env:
          KEY: ${{ secrets.NEOSMITH_STAGING_KEY }}
        run: |
          BASE=$(node -p "require('./packages/cli/harnesses.json').environments['${E2E_ENV}'].baseUrl")
          ANSWERED=$(curl -s --max-time 20 -H "Authorization: Bearer $KEY" "$BASE/whoami"                      | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).environment || 'missing'")
          echo "asked for '${E2E_ENV}', $BASE answered '$ANSWERED'"
          if [ "$ANSWERED" != "${E2E_ENV}" ] && [ "$ANSWERED" != "missing" ]; then
            echo "::error::Asked for ${E2E_ENV} but $BASE identifies as '$ANSWERED'."
            exit 1
          fi

      - name: Install the CLI from the tarball
        shell: bash
        run: |
          set -e
          TARBALL=$(ls "$RUNNER_TEMP"/tarball/neosmithai-cli-*.tgz)
          npm install -g "$TARBALL"
          BIN=$(command -v neosmith)
          echo "resolved: $BIN"
          # CONTRIBUTING.md:69 flags this exact confusion — if the binary
          # resolves into the checkout, the tarball is not what is being tested.
          case "$BIN" in
            *"$GITHUB_WORKSPACE"*)
              echo "::error::neosmith resolved to the checkout, not the installed package"
              exit 1 ;;
          esac
          neosmith --version

      # A bad upstream release is diagnosable and pinnable via the dispatch
      # inputs. Retried once: a failed install is a runner problem, not a CLI
      # regression, and the message must say so or it gets mis-triaged.
      - name: Install the real harness binaries
        id: harnesses
        shell: bash
        # The dispatch inputs go through `env:`, never straight into the `run:`
        # block. A `${{ }}` expansion is textual substitution BEFORE the shell
        # ever sees the script, so a version string containing a quote and a
        # semicolon becomes shell code. Only maintainers can dispatch this
        # workflow, which caps the blast radius but does not make the pattern
        # safe — and `harnesses` below has the same shape.
        env:
          CLAUDE_VERSION: ${{ inputs.claude_version || 'latest' }}
          CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
        run: |
          install_one() {
            npm install -g "$1" || { echo "retrying $1"; sleep 10; npm install -g "$1"; }
          }
          if ! install_one "@anthropic-ai/claude-code@${CLAUDE_VERSION}"; then
            echo "::error::Claude Code failed to install — this is a runner/upstream problem, NOT a CLI bug."
            exit 1
          fi
          if ! install_one "@openai/codex@${CODEX_VERSION}"; then
            echo "::error::Codex failed to install — this is a runner/upstream problem, NOT a CLI bug."
            exit 1
          fi
          claude --version || true
          codex --version || true

      - name: Run the e2e driver over every harness
        id: run
        shell: bash
        env:
          # The driver reads the key from here and never echoes it. The
          # UI-driven harnesses print the key inside a box; GitHub masks exact
          # secret matches, so the driver asserts on base URLs, model ids and
          # UI-path strings instead — never on the key itself.
          NEOSMITH_E2E_KEY: ${{ secrets.NEOSMITH_STAGING_KEY }}
          # Codex reads the key from the environment at runtime: `codex on`
          # writes only env_key = "OPENAI_API_KEY", a NAME, never the secret.
          # setx (what the CLI correctly prints on Windows) does not affect the
          # current process, so CI must export it itself.
          OPENAI_API_KEY: ${{ secrets.NEOSMITH_STAGING_KEY }}
          # Via env, not inline — see the note on the install step above.
          HARNESS_LIST: ${{ inputs.harnesses || 'all' }}
        run: |
          set +e
          LIST="${HARNESS_LIST}"
          if [ "$LIST" = "all" ]; then
            LIST="claude,codex,continue,zed,copilot,cline,jetbrains,cursor"
          fi
          mkdir -p "$RUNNER_TEMP/e2e"
          FAILED=""
          IFS=','
          for h in $LIST; do
            echo "::group::$h"
            node packages/cli/scripts/e2e/run.js \
              --harness "$h" --env "${E2E_ENV}" \
              --out "$RUNNER_TEMP/e2e/$h"
            code=$?
            echo "::endgroup::"
            # Retry ONLY the two harnesses that make a real inference call.
            # Config-write and printed-instruction assertions are deterministic;
            # retrying those would mask a genuine regression.
            if [ $code -ne 0 ] && { [ "$h" = "claude" ] || [ "$h" = "codex" ]; }; then
              echo "::warning::$h failed; retrying its inference path once"
              sleep 15
              node packages/cli/scripts/e2e/run.js \
                --harness "$h" --env "${E2E_ENV}" \
                --out "$RUNNER_TEMP/e2e/$h-retry"
              code=$?
            fi
            [ $code -ne 0 ] && FAILED="$FAILED $h"
          done
          unset IFS
          if [ -n "$FAILED" ]; then
            echo "::error::e2e failed for:$FAILED"
            exit 1
          fi

      # Redact BEFORE upload. ~/.claude/settings.json holds
      # ANTHROPIC_AUTH_TOKEN verbatim, and the driver's sandbox HOME is never
      # uploaded — only its scrubbed artifacts directory.
      - name: Scrub artifacts
        if: always()
        shell: bash
        env:
          KEY: ${{ secrets.NEOSMITH_STAGING_KEY }}
        run: |
          find "$RUNNER_TEMP/e2e" -type f 2>/dev/null | while read -r f; do
            node -e '
              const fs=require("fs");const [f,key]=process.argv.slice(1);
              let s;try{s=fs.readFileSync(f,"utf8")}catch{process.exit(0)}
              if(key) s=s.split(key).join("***");
              // Kept in sync with .gitleaks.toml and packages/cli/lib/key.js.
              // Adding a key tier means editing all three.
              s=s.replace(/sk-(plus|std|slm|maestro)-[A-Za-z0-9_-]{4,}/g,"sk-$1-***")
                 .replace(/eyJ[A-Za-z0-9_-]{10,}/g,"eyJ***")
                 // Harnesses write the key into their own config under a
                 // variable name. Masking the bare key shape is not enough if
                 // the file records `ANTHROPIC_AUTH_TOKEN=<something else>`.
                 .replace(/((?:ANTHROPIC_(?:AUTH_TOKEN|API_KEY)|OPENAI_API_KEY|NEOSMITH_[A-Z_]*(?:KEY|TOKEN|SECRET))["'\s]*[:=]\s*"?)[^"'\s,}]+/g,"$1***");
              fs.writeFileSync(f,s);
            ' "$f" "$KEY"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e
          retention-days: 3

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} · env=${E2E_ENV}"
            echo ""
            echo "| harness | result | checks |"
            echo "|---|---|---|"
            for d in "$RUNNER_TEMP"/e2e/*/; do
              h=$(basename "$d")
              s=$(ls "$d"/summary.*.json 2>/dev/null | head -1)
              [ -z "$s" ] && continue
              # node -e swallows its own script, so positional args start at
              # process.argv[1] — not [2]. The earlier slice(2) tripped on
              # itself here: argv[2] was the harness name ("claude"), and
              # readFileSync tried to open a file literally called "claude".
              node -e '
                const fs=require("fs");const [f,h]=process.argv.slice(1);
                const j=JSON.parse(fs.readFileSync(f,"utf8"));
                const pass=j.checks.filter(c=>c.ok).length;
                console.log(`| ${h} | ${j.ok?"pass":"FAIL"} | ${pass}/${j.checks.length} |`);
              ' -- "$s" "$h"
            done
          } >> "$GITHUB_STEP_SUMMARY"
